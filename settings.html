<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | FinTrack Pro</title>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

        tailwind.config = {

            darkMode: "class",

            theme: {

                extend: {

                    fontFamily: {

                        inter: ["Inter", "sans-serif"],

                    },

                },

            },

        };

    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">

</head>

<body class="font-inter bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <main id="dashboard-page" class="flex min-h-screen">

        <!-- Sidebar -->

        <aside id="sidebar"
            class="flex w-[250px] flex-col justify-between border-r border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">

            <!-- Top Section -->

            <div>

                <!-- Logo -->

                <div class="flex items-center gap-3 border-slate-200 px-6 py-4 dark:border-slate-800">

                    <i class="fa-solid fa-layer-group text-[24px] text-slate-800 dark:text-white">
                    </i>

                    <div>

                        <h1 class="text-[18px] font-bold text-slate-900 dark:text-white">

                            FinTrack Pro

                        </h1>

                        <p class="text-[12px] text-slate-500 dark:text-slate-400">

                            Enterprise Finance

                        </p>

                    </div>

                </div>

                <!-- Navigation -->

                <nav class="mt-6 px-4">

                    <ul class="space-y-2">

                        <!-- Inactive Menu -->

                        <li>

                            <a href="./dashboard.html"
                                class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-[16px] font-medium text-slate-600 transition-colors duration-200 hover:bg-blue-100">

                                <i class="fa-solid fa-table-columns"></i>

                                Dashboard

                            </a>

                        </li>

                        <!-- Active Menu -->

                        <li>

                            <a href="./settings.html"
                                class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-[16px] font-medium transition-all duration-200 bg-blue-100 text-blue-700 hover:bg-blue-200 dark:bg-blue-950 dark:text-blue-500 dark:hover:bg-zinc-600">

                                <i class="fa-solid fa-gear"></i>

                                Settings

                            </a>

                        </li>

                    </ul>

                </nav>

            </div>


            <!-- Bottom Section -->

            <div class="p-4">

                <button
                    id="add-transaction-btn" class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3 font-medium text-white transition hover:bg-blue-700">

                    <i class="fa-solid fa-plus"></i>

                    Add Transaction

                </button>

            </div>

        </aside>


        <!-- ================================================= --> <!-- Main Wrapper -->
        <!-- ================================================= -->

        <section id="main-wrapper" class="flex flex-1 flex-col">

            <!-- ============================================= --> <!-- Header -->
            <!-- ============================================= -->

        <header id="header"
            class="flex h-16 items-center justify-end border-b border-slate-200 bg-white px-6 py-6 dark:border-slate-800 dark:bg-slate-900">
        
            <div class="flex items-center gap-6">
        
                <!-- Username -->
        
                <div id="logged-in-username" class="border-r border-slate-300 pr-6 dark:border-slate-700">
        
                    <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">
        
                        Janmesh_1030
        
                    </span>
        
                </div>
        
                <!-- Logout Button -->
        
                <button id="logout-btn"
                    class="flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
        
                    <i class="fa-solid fa-right-from-bracket"></i>
        
                    Logout
        
                </button>
        
            </div>
        
        </header>


            <!-- ============================================= -->
            <!-- Main Content -->
            <!-- ============================================= -->

            <main id="main-content" class="flex-1 p-10">

                <!-- Page Heading -->

                <section id="page-heading">

                    <h1 class="text-[28px] font-bold leading-none text-slate-900 dark:text-white">

                        Settings

                    </h1>

                    <p class="mt-2 text-[14px] text-slate-500 dark:text-slate-400">

                        Manage your account profile and app formatting.

                    </p>

                </section>



                <!-- ============================================= -->
                <!-- Profile Details -->
                <!-- ============================================= -->

                <section id="profile-details"
                    class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900">

                    <!-- Heading -->

                    <h2 class="text-[20px] font-bold text-slate-900 dark:text-white">
                        Profile Details
                    </h2>

                    <!-- Form -->

                    <form id="profile-form" class="mt-6">

                        <div class="grid grid-cols-2 gap-6">

                            <!-- Full Name -->

                            <div>

                                <label for="full-name"
                                    class="mb-2 block text-[14px] font-medium text-slate-700 dark:text-slate-300">

                                    Full Name

                                </label>

                                <input  id="profile-username" type="text" placeholder="Enter your full name"
                                    value="Janmesh_1030"
                                    class="h-11 w-full rounded-lg border border-slate-300 bg-white px-4 text-[14px] text-slate-700 outline-none transition-all duration-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white dark:focus:ring-blue-900/40">

                            </div>



                            <!-- Primary Currency -->

                            <div>

                                <label for="primary-currency"
                                    class="mb-2 block text-[14px] font-medium text-slate-700 dark:text-slate-300">

                                    Primary Currency

                                </label>

                                <select id="primary-currency"
                                    class="h-11 w-full rounded-lg border border-slate-300 bg-white px-4 text-[14px] text-slate-700 outline-none transition-all duration-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-900 dark:text-white dark:focus:ring-blue-900/40">

                                    <option value="INR">INR (₹)</option>
                                    <option value="USD" selected>USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="GBP">GBP (£)</option>

                                </select>

                            </div>

                        </div>



                        <!-- Save Button -->

                        <button id="save-profile-btn" type="submit"
                            class="mt-10 rounded-lg bg-slate-900 px-6 py-3 text-[14px] font-semibold text-white transition-all duration-200 hover:bg-slate-800 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200">

                            Save Changes

                        </button>

                    </form>

                </section>

            </main>

        </section>

    </main>


    <!-- ===================================================== --> <!-- Add Transaction Modal -->
    <!-- ===================================================== -->

    <section id="transaction-modal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
    
        <!-- ================================================= -->
        <!-- Modal -->
        <!-- ================================================= -->
    
        <div
            class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl dark:border-slate-800 dark:bg-slate-900">
    
            <!-- ================================================= -->
            <!-- Header -->
            <!-- ================================================= -->
    
            <div class="flex items-center justify-between">
    
                <h2 class="text-[20px] font-bold text-slate-900 dark:text-white">
                    Add Transaction
                </h2>
    
                <button id="close-modal-btn"
                    class="flex h-10 w-10 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:hover:bg-slate-800 dark:hover:text-white">
    
                    <i class="fa-solid fa-xmark text-xl"></i>
    
                </button>
    
            </div>
    
    
    
            <!-- ================================================= -->
            <!-- Form -->
            <!-- ================================================= -->
    
        <form id="transaction-form" class="mt-8 space-y-5">
        
            <!-- Type -->
        
            <div>
        
                <label class="mb-2 block text-[15px] font-medium text-slate-700 dark:text-slate-300">
        
                    Type
        
                </label>
        
                <select id="transaction-type"
                    class="h-11 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
        
                    <option value="Income">Income</option>
                    <option value="Expense" selected>Expense</option>
        
                </select>
        
            </div>
        
        
        
            <!-- Description -->
        
            <div>
        
                <label class="mb-2 block text-[15px] font-medium text-slate-700 dark:text-slate-300">
        
                    Description
        
                </label>
        
                <input id="transaction-description" type="text" placeholder="e.g. Amazon, Salary, Coffee"
                    class="h-11 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
        
            </div>
        
        
        
            <!-- Amount + Date -->
        
            <div class="grid grid-cols-2 gap-4">
        
                <div>
        
                    <label class="mb-2 block text-[15px] font-medium text-slate-700 dark:text-slate-300">
        
                        Amount
        
                    </label>
        
                    <input id="transaction-amount" type="number" placeholder="0.00"
                        class="h-11 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
        
                </div>
        
                <div>
        
                    <label class="mb-2 block text-[15px] font-medium text-slate-700 dark:text-slate-300">
        
                        Date
        
                    </label>
        
                    <input id="transaction-date" type="date"
                        class="h-11 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
        
                </div>
        
            </div>
        
        
        
            <!-- Category -->
        
            <div>
        
                <label class="mb-2 block text-[15px] font-medium text-slate-700 dark:text-slate-300">
        
                    Category
        
                </label>
        
                <select id="transaction-category"
                    class="h-11 w-full rounded-lg border border-slate-300 px-4 outline-none focus:border-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
        
                    <option value="" selected disabled>Select Category</option>
        
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Salary">Salary</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
        
                </select>
        
            </div>
        
        
        
            <!-- Button -->
        
            <button id="save-transaction-btn" type="submit"
                class="mt-3 h-12 w-full rounded-lg bg-slate-900 text-[15px] font-semibold text-white transition hover:bg-slate-800 dark:bg-white dark:text-slate-900">
        
                Save Transaction
        
            </button>
        
        </form>
    
        </div>
    
    </section>

    <!-- ========================================================================================================================================================================== -->

    <!-- Chart JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Main JS -->

    <script src="./main.js"></script>

</body>

</html>
