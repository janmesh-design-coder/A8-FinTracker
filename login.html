<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinTrack Pro</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <link rel="stylesheet" href="./style.css">

</head>

<body class="min-h-screen bg-slate-100 font-inter">

    <main class="flex min-h-screen items-center justify-center px-5">

        <section class="w-full max-w-[450px] rounded-2xl border border-slate-200 bg-white p-12 shadow-lg">

            <header class="text-center">

                <h1 class="text-[32px] font-bold leading-none text-slate-900">
                    Welcome Back
                </h1>

                <p class="mt-3 text-base text-slate-500">
                    Login to FinTrack Pro
                </p>

            </header>

            <form id="login-form" class= "mt-8 space-y-5">

                <div>

                    <label for="username" class="mb-2 block text-sm font-medium text-slate-700">

                        Username

                    </label>

                    <input type="text" id="username" placeholder="Enter username"
                        class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200">

                </div>

                <div>

                    <label for="password" class="mb-2 block text-sm font-medium text-slate-700">

                        Password

                    </label>

                    <input type="password" id="password" placeholder="Enter password"
                        class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200">

                </div>

                <button type="submit"
                    class="w-full rounded-lg bg-blue-700 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-800">

                    Login

                </button>

            </form>

            <p class="mt-6 text-center text-sm text-slate-500">

                Don't have an account?

                <a href="./register.html" class="font-medium text-blue-700 hover:underline">

                    Register here

                </a>

            </p>

        </section>

    </main>

    <script src="./main.js"></script>

</body>

</html>
