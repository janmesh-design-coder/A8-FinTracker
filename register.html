<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FinTrack Pro</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        inter: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">

</head>

<body class="min-h-screen bg-slate-100 font-inter">

    <main class="flex min-h-screen items-center justify-center px-5">

        <section class="w-full max-w-[450px] rounded-2xl border border-slate-200 bg-white p-12 shadow-lg">

            <!-- Heading -->

            <header class="text-center">

                <h1 class="text-[32px] font-bold leading-none text-slate-900">
                    Create Account
                </h1>

                <p class="mt-3 text-base text-slate-500">
                    Join FinTrack Pro
                </p>

            </header>

            <!-- Register Form -->

            <form id="register-form" class="mt-8 space-y-5" class="mt-8 space-y-5">

                <!-- Username -->

                <div>

                    <label for="username" class="mb-2 block text-sm font-medium text-slate-700">

                        Choose a Username

                    </label>

                    <input type="text" id="username" placeholder="Enter username"
                        class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition focus:border-green-600 focus:ring-2 focus:ring-green-200">

                </div>

                <!-- Password -->

                <div>

                    <label for="password" class="mb-2 block text-sm font-medium text-slate-700">

                        Password

                    </label>

                    <input type="password" id="password" placeholder="Enter password"
                        class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none transition focus:border-green-600 focus:ring-2 focus:ring-green-200">

                </div>

                <!-- Register Button -->

                <button id="register-btn" type="submit"
                    class="w-full rounded-lg bg-green-600 py-2.5 text-sm font-semibold text-white transition hover:bg-green-700">

                    Register

                </button>

            </form>

            <!-- Footer -->

            <p class="mt-6 text-center text-sm text-slate-500">

                Already have an account?

                <a href="./login.html" class="font-medium text-blue-700 hover:underline">

                    Login here

                </a>

            </p>

        </section>

    </main>

    <script src="./main.js"></script>

</body>

</html>
